name: HomeTV
options:
  bundleIdPrefix: com.hometv
  deploymentTarget:
    tvOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  HomeTV:
    type: application
    platform: tvOS
    deploymentTarget: "26.0"
    sources:
      - path: HomeTV
        excludes:
          - "**/.DS_Store"
    # Build settings (incl. secrets) come from a gitignored xcconfig. Copy
    # Secrets.example.xcconfig → Secrets.xcconfig and fill it in.
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    info:
      path: HomeTV/Info.plist
      properties:
        CFBundleDisplayName: HomeTV
        UILaunchScreen: {}
        # canOpenURL on tvOS only returns true for schemes declared here, even
        # when the target app is installed. Without these, every external player
        # falsely reports "not installed".
        LSApplicationQueriesSchemes:
          - infuse
          - vlc-x-callback
        # Trakt credentials are injected from Secrets.xcconfig at build time via
        # variable substitution, then read at runtime with Bundle.main (see TraktConfig).
        TRAKT_CLIENT_ID: "$(TRAKT_CLIENT_ID)"
        TRAKT_CLIENT_SECRET: "$(TRAKT_CLIENT_SECRET)"
        # TMDB v3 API key, injected the same way and read in TMDBConfig.
        TMDB_API_KEY: "$(TMDB_API_KEY)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hometv.HomeTV
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "3"
        SUPPORTED_PLATFORMS: "appletvos appletvsimulator"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
